spring:
  application:
    name: jamigos

  data:
    mongodb:
      uri: mongodb://admin:admin@localhost:27017/jamigos?authSource=admin

  datasource:
    url: jdbc:postgresql://localhost:5432/jamigos
    username: admin
    password: admin

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/jamigos-realm

actuator:
  username: admin
  password: admin

springdoc:
  swagger-ui:
    oauth:
      client-id: "jamigos-client"
      use-pkce-with-authorization-code-grant: true
    oauth2-redirect-url: "http://localhost:8082/swagger-ui/oauth2-redirect.html"

server:
  port: 8082

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    dev.michaelgoldman.jamigos.aop: INFO

management:
  endpoints:
    web:
      exposure:
        include: info,health
  endpoint:
    health:
      show-details: always
