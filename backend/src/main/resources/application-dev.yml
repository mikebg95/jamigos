spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
jamigos:
  cors:
    # Comma-separated deployed frontend origins, e.g. https://app.example.com
    allowed-origins: ${JAMIGOS_CORS_ALLOWED_ORIGINS:}

actuator:
  username: ${ACTUATOR_USERNAME}
  password: ${ACTUATOR_PASSWORD}

springdoc:
  swagger-ui:
    oauth:
      client-id: "jamigos-client"
      use-pkce-with-authorization-code-grant: true
    oauth2-redirect-url: "${BACKEND_PUBLIC_URL}/swagger-ui/oauth2-redirect.html"