spring:
  application:
    name: todo-app

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: 8082
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    com.example.todoapp.aop: INFO
management:
  endpoints:
    web:
      exposure:
        include: info,health