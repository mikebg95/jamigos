spring:
  application:
    name: jamigos

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: 8082
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    com.example.jamigos.aop: INFO
management:
  endpoints:
    web:
      exposure:
        include: info,health

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.14