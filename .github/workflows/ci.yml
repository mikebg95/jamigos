name: Build & Deploy Application

permissions:
    contents: read
    packages: write

on: 
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with: 
          # For PRs it compares against the PR base; for pushes it's the previous commit.
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  build-test-backend:
    name: Build & test backend
    needs: changes
    if: ${{ needs.changes.outputs.backend_changed == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build & Test Backend
        run: mvn -B -ntp clean verify -Dspring.profiles.active=test

  build-test-frontend:
    name: Build & test frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend_changed == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Run Lint
      run: npm run lint
    - name: Test Frontend
      run: npm run test
    - name: Build Frontend
      env:
        VITE_KEYCLOAK_URL: ${{ secrets.VITE_KEYCLOAK_URL }}
        VITE_KEYCLOAK_REALM: ${{ secrets.VITE_KEYCLOAK_REALM }}
        VITE_KEYCLOAK_CLIENT_ID: ${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}
      run: npm run build

  build-push-backend-docker-image:
    name: Build backend & push backend Docker image
    needs: [changes, build-test-backend]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend_changed == 'true' &&
      needs.build-test-backend.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3 
        with: 
          registry: ghcr.io 
          username: ${{ github.actor }} 
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with: 
          context: ./backend
          push: true
          tags: |
              ghcr.io/${{ github.repository }}/todo-backend:dev
              ghcr.io/${{ github.repository }}/todo-backend:${{ github.sha }}

  build-push-frontend-docker-image:
    name: Build frontend & push frontend Docker image
    needs: [changes, build-test-frontend]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' && 
      needs.changes.outputs.frontend_changed == 'true' && 
      needs.build-test-frontend.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3 
        with: 
          registry: ghcr.io 
          username: ${{ github.actor }} 
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with: 
          context: ./frontend
          push: true
          tags: |
              ghcr.io/${{ github.repository }}/todo-frontend:dev
              ghcr.io/${{ github.repository }}/todo-frontend:${{ github.sha }}
          build-args: |
            VITE_KEYCLOAK_URL=${{ secrets.VITE_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ secrets.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}

  deploy-backend-to-render:
    name: Deploy backend to Render
    needs: [changes, build-push-backend-docker-image]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - name: Deploy backend to Render
        if: ${{ needs.changes.outputs.backend_changed == 'true' }}
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true

  deploy-frontend-to-render:
    name: Deploy frontend to Render
    needs: [changes, build-push-frontend-docker-image]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - name: Deploy frontend to Render
        if: ${{ needs.changes.outputs.frontend_changed == 'true' }}
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true
