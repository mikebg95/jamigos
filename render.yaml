services:
  # KEYCLOAK (Authentication)
  - name: jamigos-keycloak
    type: web
    runtime: image
    image:
      url: ghcr.io/mikebg95/jamigos/jamigos-keycloak:dev
      creds:
      - github
    plan: free
    region: frankfurt
    envVars:
      - key: KEYCLOAK_ADMIN
        sync: false
      - key: KEYCLOAK_ADMIN_PASSWORD
        sync: false
      - key: KC_HOSTNAME
        sync: false # public Keycloak hostname, set in the Render dashboard
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_PROXY
        value: edge
      - key: KC_HEALTH_ENABLED
        value: "true"
    healthCheckPath: /health/ready

  # BACKEND (Spring Boot)
  - name: jamigos-backend
    type: web
    runtime: image
    image:
      url: ghcr.io/mikebg95/jamigos/jamigos-backend:dev
      creds:
      - github
    plan: free
    region: frankfurt
    envVars:
      - { key: SPRING_PROFILES_ACTIVE, value: dev }
      - { key: SPRING_DATA_MONGODB_URI, sync: false }
      - { key: KEYCLOAK_ISSUER_URI, sync: false }          # https://<keycloak-host>/realms/jamigos-realm
      - { key: BACKEND_PUBLIC_URL, sync: false }           # used for the Swagger UI OAuth2 redirect
      - { key: JAMIGOS_CORS_ALLOWED_ORIGINS, sync: false } # the frontend's public origin
      - { key: ACTUATOR_USERNAME, sync: false }
      - { key: ACTUATOR_PASSWORD, sync: false }            # plain or {bcrypt}-encoded
    # If you use Actuator, you can add:
    # healthCheckPath: /actuator/health

  # FRONTEND (Nginx serving built files)
  - name: jamigos-frontend
    type: web
    runtime: image
    image:
      url: ghcr.io/mikebg95/jamigos/jamigos-frontend:dev
      creds:
      - github
    plan: free
    region: frankfurt
    envVars:
      # The backend's public URL (works regardless of private DNS)
      - key: BACKEND_URL
        sync: false
    healthCheckPath: /
