services:
  # KEYCLOAK (Authentication)
  - name: jamigos-keycloak
    type: web
    runtime: image
    image:
      url: ghcr.io/mikebg95/jamigos/jamigos-keycloak:dev
      creds:
      - github
    plan: free
    region: frankfurt
    envVars:
      - key: KEYCLOAK_ADMIN
        sync: false
      - key: KEYCLOAK_ADMIN_PASSWORD
        sync: false
      - key: KC_HOSTNAME
        value: keycloak.jamigos.app
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_PROXY
        value: edge
      - key: KC_HEALTH_ENABLED
        value: "true"
    healthCheckPath: /health/ready

  # BACKEND (Spring Boot)
  - name: jamigos-backend
    type: web
    runtime: image
    image:
      url: ghcr.io/mikebg95/jamigos/jamigos-backend:dev
      creds:
      - github
    plan: free
    region: frankfurt
    envVars:
      - { key: SPRING_PROFILES_ACTIVE, value: dev }
      - { key: SPRING_DATA_MONGODB_URI, sync: false }
    # If you use Actuator, you can add:
    # healthCheckPath: /actuator/health

  # FRONTEND (Nginx serving built files)
  - name: jamigos-frontend
    type: web
    runtime: image
    image:
      url: ghcr.io/mikebg95/jamigos/jamigos-frontend:dev
      creds:
      - github
    plan: free
    region: frankfurt
    envVars:
      # Use the backend's PUBLIC URL (works regardless of private DNS)
      - key: BACKEND_URL
        value: https://todo-backend-w132.onrender.com/
    healthCheckPath: /
