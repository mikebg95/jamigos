services:
  # BACKEND (Spring Boot)
  - name: jamigos-backend
    type: web
    runtime: image
    image:
      url: ghcr.io/mikebg95/jamigos/jamigos-backend:dev
    plan: free
    region: frankfurt
    envVars:
      - { key: SPRING_PROFILES_ACTIVE, value: dev }
      - { key: SPRING_DATA_MONGODB_URI, sync: false }
    # If you use Actuator, you can add:
    # healthCheckPath: /actuator/health

  # FRONTEND (Nginx serving built files)
  - name: jamigos-frontend
    type: web
    runtime: image
    image:
      url: ghcr.io/mikebg95/jamigos/jamigos-frontend:dev
    plan: free
    region: frankfurt
    envVars:
      # Use the backend's PUBLIC URL (works regardless of private DNS)
      - key: BACKEND_URL
        value: https://jamigos-backend.onrender.com/
    healthCheckPath: /
